[package]
name = "easymyp-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Warhammer Online .myp archive tool with bundled filename dictionary"

[[bin]]
name = "myp"
path = "src/main.rs"

[dependencies]
flate2 = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
